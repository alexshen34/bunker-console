# 自动构建工作流。
# 注意：仓库未附带 libs/ 下的两个 Immersive Portals 编译期嵌套 jar
# （imm_ptl_core-5.2.0.jar、q_misc_util-5.2.0.jar），详见 README「编译期 API 依赖」。
# CI 执行编译前需先按 README 说明补齐 libs/，否则编译步骤会因找不到本地依赖而失败。

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: build
        run: gradle build --no-daemon --no-configuration-cache

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
